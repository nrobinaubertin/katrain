name: katrain
base: core22
version: '1.17.1'
summary: Go/Baduk/Weiqi playing and teaching app with a variety of AIs
description: |
  KaTrain is a tool for analyzing games and playing go with AI feedback from KataGo:
  - Review your games to find the moves that were most costly in terms of points lost.
  - Play against AI and get immediate feedback on mistakes with option to retry.
  - Play against a wide range of weakened versions of AI with various styles.
  - Automatically generate focused SGF reviews which show your biggest mistakes.
grade: stable
confinement: strict

plugs:
  graphics-core22:
    interface: content
    target: $SNAP/graphics
    default-provider: mesa-core22

parts:
  katago-eigen:
    plugin: dump
    source: https://github.com/lightvector/KataGo/releases/download/v1.16.4/katago-v1.16.4-eigen-linux-x64.zip
    source-type: zip
    organize:
      '*': katago-files/
    stage:
      - katago-files/*

  katrain:
    after: [katago-eigen]
    plugin: python
    source: .
    build-packages:
      - build-essential
      - ffmpeg
      - git
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - libavcodec-dev
      - libavdevice-dev
      - libavfilter-dev
      - libavformat-dev
      - libgl-dev
      - libportmidi-dev
      - libsdl1.2-dev
      - libsdl2-dev
      - libsdl2-image-dev
      - libsdl2-mixer-dev
      - libsdl2-ttf-dev
      - libswscale-dev
      - libzip-dev
      - ocl-icd-opencl-dev
      - opencl-headers
      - pkg-config
      - zlib1g-dev
      - python3-venv
      - wget
    stage-packages:
      - ffmpeg
      - freeglut3
      - libgl1-mesa-dev
      - libgl1-mesa-dri
      - libglu1-mesa
      - libgstreamer1.0-0
      - libmtdev1
      - libpulse0
      - libstdc++6
      - libzip4
      - mesa-opencl-icd
      - python3-venv
      - xclip
      - xsel
    override-build: |
      craftctl default

      # Find the installed KaTrain package location
      KATRAIN_PKG=$(find ${SNAPCRAFT_PART_INSTALL}/lib -type d -path "*/site-packages/katrain" -not -path "*/katrain/KataGo" | head -1)

      if [ -z "$KATRAIN_PKG" ]; then
        echo "ERROR: KaTrain package not found"
        exit 1
      fi

      echo "Installing KataGo into: $KATRAIN_PKG"

      # Create KataGo directory
      KATAGO_DIR="$KATRAIN_PKG/KataGo"
      mkdir -p "$KATAGO_DIR"

      # Extract and copy KataGo binary from staged katago-eigen part
      KATAGO_APPIMAGE=$(find ${SNAPCRAFT_STAGE}/katago-files -name "katago" -type f | head -1)

      if [ -z "$KATAGO_APPIMAGE" ]; then
        echo "ERROR: KataGo AppImage not found"
        exit 1
      fi

      # Extract AppImage contents (KataGo is packaged as AppImage)
      echo "Extracting KataGo AppImage..."
      cd $(dirname "$KATAGO_APPIMAGE")
      chmod +x katago
      ./katago --appimage-extract > /dev/null 2>&1 || {
        echo "ERROR: Failed to extract KataGo AppImage"
        exit 1
      }

      # Copy the extracted binary
      if [ -f squashfs-root/usr/bin/katago ]; then
        cp squashfs-root/usr/bin/katago "$KATAGO_DIR/katago"
      elif [ -f squashfs-root/katago ]; then
        cp squashfs-root/katago "$KATAGO_DIR/katago"
      else
        echo "ERROR: Extracted katago binary not found"
        ls -R squashfs-root/
        exit 1
      fi

      chmod +x "$KATAGO_DIR/katago"
      echo "KataGo binary extracted and installed: $KATAGO_DIR/katago"

      # Clean up extraction directory
      rm -rf squashfs-root

      # Download analysis_config.cfg
      echo "Downloading analysis_config.cfg..."
      wget -q -O "$KATAGO_DIR/analysis_config.cfg" \
        https://raw.githubusercontent.com/lightvector/KataGo/v1.16.4/cpp/configs/analysis_example.cfg

      if [ ! -f "$KATAGO_DIR/analysis_config.cfg" ]; then
        echo "ERROR: Failed to download analysis_config.cfg"
        exit 1
      fi

      echo "analysis_config.cfg installed"

      # Verify installation
      ls -lh "$KATAGO_DIR"
      if [ -x "$KATAGO_DIR/katago" ]; then
        echo "KataGo installation verified"
      else
        echo "ERROR: KataGo binary not executable"
        exit 1
      fi
apps:
  katrain:
    command: bin/python3 -m katrain
    extensions: [gnome]
    plugs:
      - home
      - network
      - network-bind
      - opengl
      - audio-playback
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
    environment:
      LD_LIBRARY_PATH: "$SNAP/lib/python3.10/site-packages/katrain/KataGo:$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/dri:$SNAP/graphics/lib:$SNAP/graphics/usr/lib/$SNAPCRAFT_ARCH_TRIPLET"
      LIBGL_DRIVERS_PATH: "$SNAP/graphics/dri:$SNAP/graphics/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/dri:$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/dri"
